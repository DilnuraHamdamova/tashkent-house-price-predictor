[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tashkent-house-price-predictor"
version = "1.0.0"
description = "Reproducible apartment price prediction for Tashkent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.4,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn==1.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_presentation.py" = ["E501"]
